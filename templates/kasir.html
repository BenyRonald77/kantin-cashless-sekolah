{% extends "base.html" %}
{% block content %}
<h2>Kasir</h2>
<form id="f">
  <input id="kartu" placeholder="Scan/ketik ID kartu (KNT-…)" required autofocus>
  <button type="button" onclick="cek()">Cek Saldo</button>
</form>
<div id="info"></div>
<h3>Produk</h3>
<div id="katalog" class="grid"></div>
<h3>Keranjang</h3>
<table id="cart"><thead><tr><th>Produk</th><th>Qty</th><th>Subtotal</th><th></th></tr></thead><tbody></tbody><tfoot></tfoot></table>
<button onclick="bayar()">Bayar</button>
{% endblock %}
{% block scripts %}
<script>
let katalog = [], cart = [], kartuAktif = null, siswaAktif = null;
async function cek() {
  kartuAktif = el("kartu").value.trim().toUpperCase();
  const semua = await api("/api/siswa");
  siswaAktif = semua.find(s => s.kartu_id === kartuAktif);
  if (!siswaAktif) return alert("Kartu tidak dikenal");
  el("info").innerHTML = `<div class="alert ok"><b>${siswaAktif.nama}</b> (${siswaAktif.kelas}) · Saldo: <b>${rupiah(siswaAktif.saldo)}</b> · Batas harian: ${rupiah(siswaAktif.batas_harian)}</div>`;
}
async function load() {
  katalog = await api("/api/produk");
  el("katalog").innerHTML = katalog.map(p =>
    `<div class="card"><b>${p.nama}</b><p>${rupiah(p.harga)}</p>
     <button onclick="tambah(${p.id})">+ Keranjang</button></div>`).join("");
}
function tambah(id) {
  const p = katalog.find(x => x.id === id);
  const ada = cart.find(x => x.produk_id === id);
  if (ada) ada.qty++; else cart.push({produk_id: id, nama: p.nama, harga: p.harga, qty: 1});
  render();
}
function render() {
  const tot = cart.reduce((a, x) => a + x.qty * x.harga, 0);
  el("cart").querySelector("tbody").innerHTML = cart.map((x, i) =>
    `<tr><td>${x.nama}</td><td>${x.qty}</td><td>${rupiah(x.qty * x.harga)}</td>
     <td><button onclick="cart.splice(${i},1);render()">hapus</button></td></tr>`).join("");
  el("cart").querySelector("tfoot").innerHTML = `<tr><td colspan="2"><b>Total</b></td><td><b>${rupiah(tot)}</b></td><td></td></tr>`;
}
async function bayar() {
  if (!kartuAktif) return alert("Scan kartu dulu");
  if (!cart.length) return alert("Keranjang kosong");
  const r = await post("/api/pembelian", {kartu_id: kartuAktif, items: cart.map(({produk_id, qty}) => ({produk_id, qty}))});
  if (r.error) return;
  alert(`Berhasil! Total ${rupiah(r.total)}, saldo tersisa ${rupiah(r.saldo_baru)}`);
  cart = []; render(); cek();
}
load();
</script>
{% endblock %}
